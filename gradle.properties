org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Release signing. The keystore is intentionally part of the repository so that
# every build (local and CI) produces an identically signed, upgradeable APK.
# See README.md ("Podpisywanie") for details.
keystore.file=keystore/mkbackup-release.jks
keystore.password=mkbackup-release
signing.key.alias=mkbackup
signing.key.password=mkbackup-release
